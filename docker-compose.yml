services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: lean_crm_postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: lean_crm
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgrespassword
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./scripts/init-db.sql:/docker-entrypoint-initdb.d/init-db.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d lean_crm"]
      interval: 5s
      timeout: 5s
      retries: 5

  # WAHA Core/Plus para pruebas de WhatsApp Web (opcional)
  waha:
    image: devlikeapro/waha
    container_name: lean_crm_waha
    restart: unless-stopped
    ports:
      - "3001:3000"
    environment:
      WHATSAPP_HOOK_URL: http://host.docker.internal:3000/api/webhooks/waha
      WHATSAPP_HOOK_EVENTS: message,message.any,state.change
      WAHA_DASHBOARD_ENABLED: "true"
      WAHA_DASHBOARD_USERNAME: admin
      WAHA_DASHBOARD_PASSWORD: adminpassword
    volumes:
      - wahadata:/app/.sessions
    profiles:
      - whatsapp-local

volumes:
  pgdata:
  wahadata:
