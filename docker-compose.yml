services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: lean_crm_postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: lean_crm
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgrespassword
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./scripts/init-db.sql:/docker-entrypoint-initdb.d/init-db.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d lean_crm"]
      interval: 5s
      timeout: 5s
      retries: 5

  # Motor de email marketing y campañas masivas
  listmonk:
    image: listmonk/listmonk:latest
    container_name: lean_crm_listmonk
    restart: unless-stopped
    ports:
      - "9000:9000"
    environment:
      - LISTMONK_db__host=postgres
      - LISTMONK_db__port=5432
      - LISTMONK_db__user=postgres
      - LISTMONK_db__password=postgrespassword
      - LISTMONK_db__database=lean_crm
      - LISTMONK_app__address=0.0.0.0:9000
    depends_on:
      postgres:
        condition: service_healthy
    profiles:
      - full

  # WAHA Core/Plus para WhatsApp Web local
  waha:
    image: devlikeapro/waha
    container_name: lean_crm_waha
    restart: unless-stopped
    ports:
      - "3001:3000"
    environment:
      WHATSAPP_HOOK_URL: http://host.docker.internal:3000/api/webhooks/waha
      WHATSAPP_HOOK_EVENTS: message,message.any,state.change
      WAHA_DASHBOARD_ENABLED: "true"
      WAHA_DASHBOARD_USERNAME: admin
      WAHA_DASHBOARD_PASSWORD: adminpassword
    volumes:
      - wahadata:/app/.sessions
    profiles:
      - full
      - whatsapp-local

volumes:
  pgdata:
  wahadata:
